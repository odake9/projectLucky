<!DOCTYPE html>
<html lang="en">
<head>
  <title>Register - Lucky Milk Tea</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- W3.CSS Framework -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fff8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    .register-box {
      background: #ffffff;
      padding: 40px 35px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      border: 2px solid #f5e6ca;
    }

    .register-box h2 {
      margin-bottom: 25px;
      color: #8b4513;
      font-weight: 600;
    }

    .input-group {
      position: relative;
      margin-bottom: 18px; /* Consistent spacing between all fields */
    }

    .register-box input[type="text"],
    .register-box input[type="email"],
    .register-box input[type="password"] {
      width: 100%;
      padding: 12px 42px 12px 12px;
      border-radius: 10px;
      border: 1px solid #d9b99b;
      outline: none;
      font-size: 15px;
      background-color: #fffdf8;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .register-box input:focus {
      border-color: #cfa47e;
      box-shadow: 0 0 5px rgba(207,164,126,0.4);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #a17a5b;
      font-size: 1.1rem;
      transition: color 0.3s ease;
    }

    .toggle-password:hover {
      color: #8b4513;
    }

    .register-box button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background-color: #cfa47e;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .register-box button:hover {
      background-color: #b68c68;
    }

    .back-links {
      margin-top: 20px;
    }

    .back-btn {
      display: inline-block;
      margin: 5px;
      color: #8b4513;
      text-decoration: none;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 8px;
      background-color: #f9e4c8;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background-color: #f1d3a8;
    }
  </style>
</head>
<body>

  <div class="register-box w3-animate-top">
    <h2>☕ Create Your Account</h2>
    <form action="register_otp.php" method="POST" class="w3-container" onsubmit="return validateForm()">
        
        <div class="input-group">
          <input type="text" name="name" placeholder="👤 Username" required>
        </div>

        <div class="input-group">
          <input type="email" name="email" placeholder="📧 Email" required>
        </div>

        <div class="input-group">
          <input type="password" name="password" id="password" placeholder="🔑 Password" required>
          <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
        </div>

        <div class="input-group">
          <input type="password" name="confirm_password" id="confirm_password" placeholder="🔒 Confirm Password" required>
          <i class="fa-solid fa-eye toggle-password" onclick="togglePassword('confirm_password', this)"></i>
        </div>

        <button type="submit">Register</button>
    </form>

    <div class="back-links">
      <a href="login.html" class="back-btn">← Back to Login</a>
      <a href="home.html" class="back-btn">🏠 Home</a>
    </div>
  </div>

  <script>
    function togglePassword(fieldId, icon) {
      const field = document.getElementById(fieldId);
      if (field.type === "password") {
        field.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        field.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    function validateForm() {
      const pass = document.getElementById("password").value;
      const confirmPass = document.getElementById("confirm_password").value;
      if (pass !== confirmPass) {
        alert("❌ Passwords do not match!");
        return false;
      }
      return true;
    }
  </script>

</body>
</html>
